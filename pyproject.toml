[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-app"
version = "0.1.0"
description = "个人极简备忘录（Windows / Python + PySide6 / SQLite）"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7",
    "cryptography>=42",
    "keyring>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memo_app = ["assets/*.png", "assets/*.svg"]
